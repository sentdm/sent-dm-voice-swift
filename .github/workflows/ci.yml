name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core:
    name: core
    timeout-minutes: 20
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check the generated contract
        run: scripts/check-contract
      - name: Build
        run: swift build
      - name: Test
        run: swift test
